specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ChainTalk
    network: arbitrum-one
    source:
      address: "0x6Cb266BB285BA5F6591e449543d259277d57C700"
      abi: ChainTalk
      startBlock: 514306515
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Post
      abis:
        - name: ChainTalk
          file: ./abis/ChainTalk.json
      eventHandlers:
        - event: Posted(indexed uint256,indexed uint256,indexed address,string)
          handler: handlePosted
      file: ./src/chain-talk.ts
