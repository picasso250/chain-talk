specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ChainTalk
    network: mainnet
    source:
      address: "0xec3639B4CC756d39e996447dE1787B09EF646b6F"
      abi: ChainTalk
      startBlock: 26111445
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Post
      abis:
        - name: ChainTalk
          file: ./abis/ChainTalk.json
      eventHandlers:
        - event: Posted(indexed uint256,indexed uint256,indexed address,string)
          handler: handlePosted
      file: ./src/chain-talk.ts
